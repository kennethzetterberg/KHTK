openapi: 3.0.2
info:
  version: 0.1.0
  title: KHTK
  description: >

    Detta är en specifikation av ett JSON-baserat filformat vars syfte är att möjliggöra strukturerad/maskinläsbar
    dokumentation av den struktur som ligger till grund för en verksamhets kundåterkoppling som den definieras
    av [Mina ärenden](https://www.dataportal.se/sv/datasets/6_71657/mina-arenden).

  license:
    name: CC0
    url: https://creativecommons.org/publicdomain/zero/1.0/

paths:
  /v1/khtk:
    get:
      operationId: getKundhandelsetypskatalog
      summary: Implementeras ej. Finns eftersom version 3.0 av OpenAPI kräver "paths".
      deprecated: true
      description: >
        Implementeras ej.

      responses:
        '200':
          description: >
            **OK**


            Data existerar i HTTP message body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KHTK'
        default:
          description: ""
components:
  schemas:
    KHTK:
      type: object
      description: >
        En kundhändelsetypskatalog.
      required:
        - schema
        - katalog
        - system
        - parametrar
        - kundhandelsemallar
        - anslagsmallar
        - processgrupper
      additionalProperties: false
      properties:
        schema:
          $ref: '#/components/schemas/Schema'
        katalog:
          $ref: '#/components/schemas/Katalog'
        system:
          type: array
          description: >
            Lista över system som skickar kundhändelser.
          items:
            $ref: '#/components/schemas/System'
        parametrar:
          type: array
          description: >
            Lista över parametrar som är tillgängliga för kundhändelsemallarna.
          items:
            $ref: '#/components/schemas/Parameter'
        kundhandelsemallar:
          type: array
          description: >
            Lista över alla kundhändelsemallar.
          items:
            $ref: '#/components/schemas/Kundhandelsemall'
        anslagsmallar:
          type: array
          description: >
            Lista över alla anslagsmallar.
          items:
            $ref: '#/components/schemas/Anslagsmall'
        processgrupper:
          type: array
          description: >
            List över processgrupper.
          items:
            $ref: '#/components/schemas/Processgrupp'
    Schema:
      type: object
      required:
        - uri
        - version
      properties:
        uri:
          type: string
          format: uri
          pattern: "urn:uuid:9c22c2bd-b018-41e6-a813-6aa3535e203f"
        version:
          $ref: '#/components/schemas/Schemaversion'
    Schemaversion:
      type: object
      description: >
        Version av schemat.
      required:
        - id
        - major
        - minor
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        major:
          type: integer
          description: >
            Filen är inte kompatibel med en programvara som arbetar med en tidigare version. 
            Särskild logik behövs för att uppgradera en version till en annan.
        minor:
          type: integer
          description: >
            Filen är kompatibel med en programvara som arbetar med en tidigare version, men dataförlust kan uppstå.
    Katalog:
      type: object
      description: >
        Information om katalogen som helhet.
      required:
        - uri
        - producent
        - producentprefix
      properties:
        uri:
          type: string
          format: uri
        namn:
          type: string
          description: >
            Namn på katalogen
          example: "Min kundhändelsekatalog"
        beskrivning:
          type: string
          description: >
            Beskrivning av katalogen.
          example: "Dokumenterar mina kundhändelsetyper"
        producent:
          type: string
          description: >
            Namn på producenten av kundhändelsekatalogen.
          example: 'Skatteverket'
        producentprefix:
          type: string
          description: >
            Kundhändelsetypens första segment. se "Mina ärenden" för mer information om kundhändelsetyper.
          example: 'SKV'
        maxdjupProcessgrupper:
          type: integer
          description: >
            Antal nivåer som processgrupper som mest tillåts organiseras i. 1 innebär att
            inga processgrupper får ha en förälder. 2 innebär att en processgrupp inte
            få ha en förälder som har en förälder, osv.
            
            Processernas maximala djup begränsas av de grupper de ingår i.
          minimum: 1
          default: 1
    System:
      type: object
      description: >
        Information om ett system som skickar kundhändelser.
      required:
        - id
        - namn
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        namn:
          type: string
          description: >
            Systemnamn
          example: "E-systemet"
        beskrivning:
          type: string
          description: >
            Beskrivning av systemet.
          example: "En e-tjänst som kunderna kan använda"
    Parameter:
      type: object
      description: >
        Information om en parameter som kan användas i kundhändelsemallarna.
      required:
        - id
        - namn
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        namn:
          type: string
          description: >
            Tekniskt namn på parametern.
            Ska hanteras som en identifierare, men också vara intuitivt begriplig (i möjligaste mån).
            Används för att sätta de parametrar som behövs för att omvandla kundhändelsemallen till en konkret
            kundhändelse.
          pattern: "^[a-zåäö_]+$"
          example: "dokumentnamn"
        beskrivning:
          type: string
          description: >
            Beskrivning av parametern.
          example: "Namn på dokumentet"
    Kundhandelsemall:
      type: object
      description: >
        Information om en kundhändelsemall.
      required:
        - metadata
        - id
        - namn
        - kategori
        - system
        - syntax
        - parametrar
        - exempel
      additionalProperties: false
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        id:
          $ref: '#/components/schemas/UUID'
        namn:
          type: string
          description: >
            Tekniskt namn på kundhändelsemallen.
            Ska hanteras som en identifierare.
            Används främst vid samtal om olika kundhändelsemallar (kravarbete).
          pattern: "^[A-Z]+[A-Z0-9]+$"
          example: "H1"
        anteckning:
          $ref: '#/components/schemas/Anteckning'
        kategori:
          type: string
          enum:
            - Mottagningskvittens
            - Beslut
            - Fråga
            - Upplysning
          description: >
            Kundhändelsens kategori.
          example: "Mottagningskvittens"
        system:
          type: array
          items:
            $ref: '#/components/schemas/IDRef'
        beskrivning:
          type: string
          description: >
            Beskrivning av  kundhändelsemallen.
          example: "Användaren skickar in ansökan. \n\nInformativt meddelande."
        syntax:
          $ref: '#/components/schemas/Syntax'
        parametrar:
          type: array
          items:
            $ref: '#/components/schemas/IDRef'
        exempel:
          type: array
          items:
            $ref: '#/components/schemas/Exempel'
    Anslagsmall:
      type: object
      description: >
        Information om en anslagsmall.
      required:
        - metadata
        - id
        - namn
        - kategori
        - system
        - syntax
        - parametrar
        - exempel
      additionalProperties: false
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        id:
          $ref: '#/components/schemas/UUID'
        namn:
          type: string
          description: >
            Tekniskt namn på anslagsmallen.
            Ska hanteras som en identifierare.
            Används som identifierare när anslag skickas, samt vid samtal om olika anslagsmallar.
          pattern: "^[A-Z]+[0-9]+$"
          example: "A1"
        anteckning:
          $ref: '#/components/schemas/Anteckning'
        kategori:
          type: string
          enum:
            - Utkast
            - Mottagningskvittens
            - Anmärkning
          description: >
            Anslagets kategori.
          example: "Utkast"
        system:
          type: array
          items:
            $ref: '#/components/schemas/IDRef'
        beskrivning:
          type: string
          description: >
            Beskrivning av  anslagsmallen.
          example: "Användaren skickar in ansökan. \n\nInformativt meddelande."
        syntax:
          $ref: '#/components/schemas/Syntax'
        parametrar:
          type: array
          items:
            $ref: '#/components/schemas/IDRef'
        exempel:
          type: array
          items:
            $ref: '#/components/schemas/Exempel'
    Syntax:
      type: object
      description: >
        Kundhändelsemallens syntax definierar utformningen av kundhändelser av den typen.
      required:
        - rubrik
      additionalProperties: false
      properties:
        rubrik:
          type: string
          description: >
            Kundhändelsemallens rubrik.
          example: "Ansökan om [ansökanstyp] mottagen"
        beskrivning:
          type: string
          description: >
            Kundhändelsemallens beskrivning.
          example: "Hej [sökande]! Din ansökan om [ansökanstyp] har mottagits."
    IDRef:
      $ref: '#/components/schemas/UUID'
    Exempel:
      type: object
      description: >
        Exempel på parametervärden.
      additionalProperties:
        type: string
      example:
        "ansökanstyp": "Övrigt"
        "dokumentnamn": "låneord.docx"
    Processgrupp:
      type: object
      required:
        - metadata
        - id
        - namn
        - arendeidsyntax
        - processer
        - steg
      additionalProperties: false
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        id:
          $ref: '#/components/schemas/UUID'
        namn:
          type: string
          description: >
            Tekniskt namn på processgruppen.
            Ska hanteras som en identifierare.
            Används främst vid samtal om olika processgrupper (kravarbete).
          pattern: "^[A-Z]+(\\.?[0-9])+$"
          example: "G1"
        anteckning:
          $ref: '#/components/schemas/Anteckning'
        beskrivning:
          type: string
          description: >
            Beskrivning av processgruppen.
          example: "Definierar processen för ansökning"
        arendeidsyntax:
          type: string
          pattern: "^[a-z0-9]+:[^:]+$"
          description: >
            Syntax för ärendeid:n. Används för information och (eventuellt) validering.
          example: "uuid:[uuid]"
        foralder:
          $ref: '#/components/schemas/IDRef'
        processer:
          type: array
          description: >
            Lista med processer som skickar kundhändelser.
          items:
            $ref: '#/components/schemas/Process'
          minItems: 1
        steg:
          type: array
          description: >
            Lista med steg i processen.
          items:
            $ref: '#/components/schemas/Steg'
    Process:
      type: object
      description: >
        En process som skickar kundhändelser.
      required:
        - namn
      properties:
        namn:
          type: string
          pattern: "^[A-Z](_?[A-Z0-9]+)*$"
          description: >
            Processens tekniska namn.
            Ska hanteras som en identifierare, men också vara intuitivt begriplig (i möjligaste mån).
            Används för att korrelera ärenden i samma process.
          example: "KAFKA1"
        beskrivning:
          type: string
          description: >
            Beskrivning av processen.
          example: "Kafkas process"
    Steg:
      type: object
      description: >
        Ett steg i processen.
      required:
        - id
        - namn
        - system
        - kundhandelsemall
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        namn:
          type: string
          pattern: "^[A-Z_]+$"
          description: >
            Tekniskt namn på processteget där händelsen uppstod.
            Ska hanteras som en identifierare, men också vara intuitivt begriplig (i möjligaste mån).
            Används för att korrelera händelser som uppstått i samma processteg.
          example: "ANSOKAN_INLAMNAD"
        system:
          type: array
          items:
            $ref: '#/components/schemas/IDRef'
        kundhandelsemall:
          $ref: '#/components/schemas/IDRef'
        startpunkt:
          type: boolean
          description: >
            Sant om processen kan börja med detta steg, annars falskt.
          default: false
        overlamningspunkt:
          type: boolean
          description: >
            Sant om initiativet för att processen ska komma vidare i och
            med detta steg överlämnas till kunden, annars falskt.
          default: false
        slutpunkt:
          type: boolean
          description: >
            Sant om processen kan sluta med detta steg, annars falskt.
          default: false
        nastaSteg:
          type: array
          description: >
            Lista med möjliga nästa steg i processen.
          items:
            $ref: '#/components/schemas/IDRef'
    Metadata:
      type: object
      description: >
        Metadata om objektet.
      required:
        - skapatDatum
        - uppdateratDatum
      additionalProperties: false
      properties:
        skapatDatum:
          type: string
          format: date-time
          description: >
            Datum då objektet först skapades.
        uppdateratDatum:
          type: string
          format: date-time
          description: >
            Datum då objektet senast uppdaterades.
    UUID:
      type: string
      description: "Ett unikt id."
      pattern: "^[a-fA-F0-9]{8}-[a-fA-F0-9]{4}-4[a-fA-F0-9]{3}-[89aAbB][a-fA-F0-9]{3}-[a-fA-F0-9]{12}$"
    Anteckning:
      type: string
      description: >
        Utrymme för minnesanteckning.
      example: "Behöver utredas."